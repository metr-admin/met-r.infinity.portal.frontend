name: CI/CD Pipeline for Met-r Infinity Frontend

on:
  push:
    branches: 
        - dev

env:
  NODE_VERSION: '18.x'

jobs:
  # Job 1: Code Quality & Linting
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"
        continue-on-error: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

  # Job 2: Build Application
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: dist/
          retention-days: 7

  # Job 3: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check if test script exists
        id: check_test
        run: |
          if npm run | grep -q "test"; then
            echo "has_test=true" >> $GITHUB_OUTPUT
          else
            echo "has_test=false" >> $GITHUB_OUTPUT
            echo "No test script found in package.json"
          fi

      - name: Run unit tests
        if: steps.check_test.outputs.has_test == 'true'
        run: npm test -- --coverage --watchAll=false
        env:
          CI: true

      - name: Upload coverage reports
        if: steps.check_test.outputs.has_test == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true
      
      - name: Skip tests notice
        if: steps.check_test.outputs.has_test == 'false'
        run: echo "ℹSkipping tests - no test script configured in package.json"

  # Job 4: Dependency Check
  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated packages
        run: npm outdated
        continue-on-error: true

  # Job 5: OWASP Dependency Check
  owasp-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'frontend-app'
          path: '.'
          format: 'JSON'
          args: >
            --enableRetired
            --enableExperimental

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: reports/
        if: always()

  # Job 6: Trivy Security Scan
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

    #   - name: Upload Trivy results to GitHub Security
    #     uses: github/codeql-action/upload-sarif@v3
    #     with:
    #       sarif_file: 'trivy-results.sarif'
    #     if: always()

      - name: Run Trivy vulnerability scanner (JSON output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-report.json'
        continue-on-error: true

      - name: Upload Trivy JSON report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
        if: always()

  # Job 7: ESLint with annotations
  lint-report:
    name: ESLint Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with report
        run: |
          npx eslint . --format json --output-file eslint-report.json || true
          npx eslint . --format stylish
        continue-on-error: true

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
        if: always()

  # Job 8: Bundle Size Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Analyze bundle size
        run: |
          npx webpack-bundle-analyzer build/static/js/*.js --mode static --report bundle-report.html || true
        continue-on-error: true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: bundle-report.html
        if: always()

  # Job 9: Lighthouse CI
  lighthouse:
    name: Lighthouse Performance Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install serve
        run: npm install -g serve

      - name: Serve application
        run: serve -s build -l 3000 &
        
      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun --collect.url=http://localhost:3000 --upload.target=temporary-public-storage
        continue-on-error: true

  # Job 10: Deploy to Cloud Panel
  deploy:
    name: Deploy to ${{ github.ref == 'refs/heads/dev' && 'Production'}}
    runs-on: ubuntu-latest
    needs: [build, test, trivy-scan, owasp-scan, lighthouse]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production'}}
      url: ${{ github.ref == 'refs/heads/main' && 'https://infinity-portal.met-r.io'}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: dist/

      - name: Create deployment package
        run: |
          cd dist
          tar -czf ../deployment.tar.gz .
          cd ..

      - name: Deploy to Cloud Panel via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "deployment.tar.gz"
          target: "/tmp/"

      - name: Extract and setup files
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            # Define paths
            DEPLOY_PATH="/home/met-r-infinity-portal/htdocs/infinity-portal.met-r.io"
            BACKUP_PATH="/home/met-r-infinity-portal/backup"
            
            # Create backup directory if it doesn't exist
            mkdir -p $BACKUP_PATH
            
            # Backup existing deployment
            if [ -d "$DEPLOY_PATH" ]; then
              BACKUP_NAME="backup-$(date +%Y%m%d-%H%M%S)"
              mv $DEPLOY_PATH $BACKUP_PATH/$BACKUP_NAME
              echo "Backed up existing deployment to $BACKUP_PATH/$BACKUP_NAME"
            fi
            
            # Create deployment directory and extract
            mkdir -p $DEPLOY_PATH
            tar -xzf /tmp/deployment.tar.gz -C $DEPLOY_PATH
            echo "Extracted deployment package"
            
            # Set permissions
            chmod -R 755 $DEPLOY_PATH
            echo "Set permissions"
            
            # Cleanup
            rm /tmp/deployment.tar.gz
            
            # Keep only last 3 backups
            cd $BACKUP_PATH
            ls -t | grep backup- | tail -n +4 | xargs -r rm -rf
            echo "Cleaned up old backups (kept last 3)"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            DEPLOY_PATH="/home/met-r-infinity-portal/htdocs/infinity-portal.met-r.io"
            
            if [ -f "$DEPLOY_PATH/index.html" ]; then
              echo "Deployment successful! index.html found"
              echo "Deployment path: $DEPLOY_PATH"
              echo "Files deployed:"
              ls -lh $DEPLOY_PATH | head -10
              exit 0
            else
              echo "Deployment verification failed! index.html not found"
              echo "Contents of deployment directory:"
              ls -la $DEPLOY_PATH
              exit 1
            fi

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "Deployment completed successfully"
          else
            echo "Deployment failed"
          fi


  # Job 11: Post-deployment health check
  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Check application health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://infinity-portal.met-r.io/)
          if [ $response -eq 200 ]; then
            echo "Application is healthy (HTTP $response)"
          else
            echo "Application health check failed (HTTP $response)"
            exit 1
          fi

      - name: Check SSL certificate
        run: |
          echo | openssl s_client -servername infinity-portal.met-r.io -connect infinity-portal.met-r.io:443 2>/dev/null | openssl x509 -noout -dates
        continue-on-error: true